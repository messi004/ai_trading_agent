version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: agent_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction --requirepass ${REDIS_PASSWORD:-}

  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: agent_qdrant
    restart: always
    ports:
      - "6333:6333"
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:-}
    volumes:
      - qdrant_data:/qdrant/storage

  trading_agent:
    build: .
    container_name: dual_engine_agent
    restart: always
    depends_on:
      - redis
      - qdrant
    env_file:
      - .env
    environment:
      - TZ=Asia/Kolkata
    volumes:
      - .:/app
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  redis_data:
  qdrant_data:
